name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lykora
          POSTGRES_PASSWORD: lykora
          POSTGRES_DB: lykora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lykora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lykora:lykora@localhost:5432/lykora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typen aus dem Schema sind aktuell
        run: npm run generate -w @lykora/spec && git diff --exit-code spec/
      - run: npm run validate
      - run: npm run typecheck -w @lykora/server
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t lykora-server:ci .

  app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lykora
          POSTGRES_PASSWORD: lykora
          POSTGRES_DB: lykora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lykora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Server für den Live-Test starten
        working-directory: .
        run: |
          npm ci
          DATABASE_URL=postgres://lykora:lykora@localhost:5432/lykora PORT=3000 \
          ADMIN_EMAIL=admin@example.org ADMIN_PASSWORD=geheim-geheim LOG_LEVEL=warn \
            nohup node server/src/server.ts > server.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:3000/lykora/api/health && break; sleep 1; done
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          LYKORA_TEST_SERVER: http://localhost:3000/lykora
          LYKORA_TEST_ADMIN: admin@example.org:geheim-geheim
      - name: APK bauen
        # Eine APK pro Prozessortyp; arm64 passt auf praktisch alle aktuellen Handys.
        run: flutter build apk --release --split-per-abi
      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        # Das Speicherkontingent für Artefakte ist begrenzt; ein volles Kontingent soll die CI nicht rot färben.
        continue-on-error: true
        with:
          name: lykora-apk-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7
      - name: Neueste Test-APK als Vorabversion „Testbuild“ ablegen
        # Release-Dateien zählen nicht zum Artefakt-Kontingent und lassen sich direkt aufs Handy laden.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/lykora-testbuild-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/lykora-testbuild-arm32.apk
          gh release delete app-testbuild --cleanup-tag --yes || true
          gh release create app-testbuild build/lykora-testbuild-arm64.apk build/lykora-testbuild-arm32.apk \
            --prerelease --target "$GITHUB_SHA" --title "Testbuild (neuester Stand)" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Für fast alle Handys passt arm64, für sehr alte arm32. Nur zum Testen, mit Debug-Schlüssel signiert."
