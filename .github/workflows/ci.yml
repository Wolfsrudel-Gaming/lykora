name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lykora
          POSTGRES_PASSWORD: lykora
          POSTGRES_DB: lykora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lykora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lykora:lykora@localhost:5432/lykora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typen aus dem Schema sind aktuell
        run: npm run generate -w @lykora/spec && git diff --exit-code spec/
      - run: npm run validate
      - run: npm run typecheck -w @lykora/server
      - run: npm test -w @lykora/spec -w @lykora/server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @lykora/web
      # Prüft TypeScript streng und baut web/dist.
      - run: npm run build -w @lykora/web

  # Image von Server, Web-Dashboard und Updater. Pull-Requests nur bauen (amd64). Pushes nach grünen Tests
  # für amd64 und arm64 nach ghcr.io; von dort spielt der Updater neue Versionen ein.
  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image-Name, Tags und Bauzeit
        id: meta
        run: |
          # ghcr.io verlangt Kleinbuchstaben; Branch-Namen wie claude/neu-1 werden zu claude-neu-1.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lykora"
          branch=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[.-]+//' | cut -c1-128)
          tags="$image:testbuild,$image:sha-${GITHUB_SHA::7}"
          if [ -n "$branch" ]; then tags="$tags,$image:$branch"; fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            LYKORA_VERSION=${{ github.run_number }}
            LYKORA_COMMIT=${{ github.sha }}
            LYKORA_BUILT_AT=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/Wolfsrudel-Gaming/lykora
            org.opencontainers.image.version=${{ github.run_number }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lykora
          POSTGRES_PASSWORD: lykora
          POSTGRES_DB: lykora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lykora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Server für den Live-Test starten
        working-directory: .
        run: |
          npm ci
          DATABASE_URL=postgres://lykora:lykora@localhost:5432/lykora PORT=3000 \
          ADMIN_EMAIL=admin@example.org ADMIN_PASSWORD=geheim-geheim LOG_LEVEL=warn \
            nohup node server/src/server.ts > server.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:3000/lykora/api/health && break; sleep 1; done
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          LYKORA_TEST_SERVER: http://localhost:3000/lykora
          LYKORA_TEST_ADMIN: admin@example.org:geheim-geheim
      - name: APK bauen
        # Eine APK pro Prozessortyp; arm64 passt auf praktisch alle aktuellen Handys.
        run: flutter build apk --release --split-per-abi
      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        # Das Speicherkontingent für Artefakte ist begrenzt; ein volles Kontingent soll die CI nicht rot färben.
        continue-on-error: true
        with:
          name: lykora-apk-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7
      - name: Neueste Test-APK als Vorabversion „Testbuild“ ablegen
        # Release-Dateien zählen nicht zum Artefakt-Kontingent und lassen sich direkt aufs Handy laden.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/lykora-testbuild-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/lykora-testbuild-arm32.apk
          gh release delete app-testbuild --cleanup-tag --yes || true
          gh release create app-testbuild build/lykora-testbuild-arm64.apk build/lykora-testbuild-arm32.apk \
            --prerelease --target "$GITHUB_SHA" --title "Testbuild (neuester Stand)" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Für fast alle Handys passt arm64, für sehr alte arm32. Nur zum Testen, mit Debug-Schlüssel signiert."
