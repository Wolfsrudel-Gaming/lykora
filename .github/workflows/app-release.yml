# Veröffentlicht die Test-APK als GitHub Release, sobald ein Tag wie app-v0.1.0 gepusht wird.
name: App-Release

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --build-name "${GITHUB_REF_NAME#app-v}" --build-number "${GITHUB_RUN_NUMBER}"
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/lykora-${GITHUB_REF_NAME#app-v}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/lykora-*.apk
          prerelease: true
          body: |
            Test-APK für Android. Installation: Datei auf dem Handy öffnen und „Unbekannte Apps installieren“ für den Browser oder Dateimanager erlauben.
            Noch mit Debug-Schlüssel signiert – nur für Tests.
